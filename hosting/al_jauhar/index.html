<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tahfiz Al-Jauhar</title>
<meta name="description" content="Aplikasi Tahfiz Al-Jauhar untuk santri, wali, dan asatidz Lembaga Pendidikan Tahsin & Tahfizh Al-Qur'an Al Jauhar, Palembang.">
<link rel="icon" href="/logo.png">
<style>
  :root { --green: #348542; --deep: #1f5729; --ink: #1d2433; --muted: #5b6475; --bg: #f6f8f5; --card: #fff; --line: #e3e7ee; }
  @media (prefers-color-scheme: dark) {
    :root { --green: #85d692; --deep: #b5e6bd; --ink: #e8ebf2; --muted: #a4abba; --bg: #12161d; --card: #1a1f29; --line: #2c3342; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; }
  main { max-width: 440px; width: 100%; text-align: center; background: var(--card); border: 1px solid var(--line);
         border-top: 4px solid var(--green); border-radius: 12px; padding: 32px 24px; }
  img { width: 140px; height: auto; }
  h1 { color: var(--deep); font-size: 26px; margin: 16px 0 4px; }
  p { color: var(--muted); margin: 0 0 20px; }
  a { color: var(--green); font-weight: 600; }
  nav { display: grid; gap: 10px; }
</style>
</head>
<body>
<main>
  <img src="/logo.png" alt="Logo Al-Jauhar">
  <h1>Tahfiz Al-Jauhar</h1>
  <p>Aplikasi santri, wali, dan asatidz<br>Lembaga Pendidikan Tahsin &amp; Tahfizh Al-Qur'an Al Jauhar, Palembang</p>
  <nav>
    <a href="/kebijakan-privasi">Kebijakan Privasi</a>
    <a href="/kebijakan-privasi#hapus-akun">Permintaan hapus akun</a>
    <a href="https://lttq-aljauharbdi.com/">Situs Lembaga</a>
  </nav>
</main>
</body>
</html>
