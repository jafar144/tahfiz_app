name: khoirunnasyien
description: "Tahfiz App Project"
publish_to: 'none'

version: 1.5.1+13

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # Core
  go_router: ^17.0.1
  get_it: ^9.2.0
  intl: ^0.20.2
  flutter_bloc: ^9.1.1
  dart_either: ^2.0.0
  
  # UI
  skeletonizer: ^2.1.2
  image_picker: ^1.2.1
  cupertino_icons: ^1.0.8
  fl_chart: ^1.1.1

  # Firebase
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2
  firebase_auth: ^6.1.4
  firebase_storage: ^13.0.6
  firebase_messaging: ^16.4.0
  cloud_functions: ^6.0.0

  # Uji bacaan Qur'an (rekam audio). Kalau `flutter pub get` gagal resolve,
  # jalankan: flutter pub add cloud_functions record
  record: ^5.2.1
  audioplayers: ^6.1.0
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  timeago: ^3.7.1
  equatable: ^2.0.8
  flutter_image_compress: ^2.4.0
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  shimmer: ^3.0.0
  google_fonts: ^8.0.2

  # Notifications
  flutter_local_notifications: ^22.0.1
  in_app_update: ^4.2.5

  # Getar kustom (amplitude/pola) untuk umpan balik haptic kuis
  vibration: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4

# `record` 5.2.1 masih meng-endorse record_linux 0.7.2 yang belum implement
# `startStream` (interface 1.6.0 mewajibkannya) -> build/analisis Linux error.
# Override ke 1.3.1 (sudah implement, butuh interface ^1.5.0 = kompatibel).
dependency_overrides:
  record_linux: 1.3.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true

# Splash screen native. Setelah ubah config jalankan:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png
  android_12:
    # Logo ber-padding agar muat penuh dalam lingkaran ikon Android 12.
    image: assets/images/splash_android12.png
    color: "#FFFFFF"
  android: true
  ios: true
  web: false


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/quran/
    - assets/sounds/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Railey
      fonts:
        - asset: assets/fonts/Railey.ttf
    # Font Al-Qur'an mushaf Madinah (KFGQPC Uthmanic Hafs v18) untuk uji bacaan.
    # © King Fahd Glorious Quran Printing Complex — bebas untuk menampilkan
    # Al-Qur'an (lihat assets/fonts/UthmanicHafs-LICENSE.txt).
    - family: QuranHafs
      fonts:
        - asset: assets/fonts/UthmanicHafs.ttf