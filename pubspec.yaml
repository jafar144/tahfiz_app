name: tahfiz_app
description: "Tahfiz App Project"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # Core
  go_router: ^14.1.0
  get_it: ^7.6.7
  intl: ^0.19.0
  flutter_bloc: ^9.1.1
  dart_either: ^2.0.0
  
  # Networking
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1
  
  # UI
  skeletonizer: ^2.1.2
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.15.2
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700